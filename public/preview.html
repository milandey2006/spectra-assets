<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spectra Assets — preview</title>
  <link rel="stylesheet" href="/globals.css" />
</head>
<body>
  <div id="root"></div>
  <script src="/vendor/react.js"></script>
  <script src="/vendor/react-dom.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <script>
    (async () => {
      try {
        let code = await (await fetch('/SpectraSite.jsx')).text();
        code = code.replace(/^\s*"use client";?/, '');
        code = code.replace(/import\s+React[^\n]*\n/, '');
        code = code.replace('export default function SpectraSite', 'function SpectraSite');
        const out = Babel.transform(code, { presets: [['react', { runtime: 'classic' }]] }).code;
        const factory = new Function('React', out + '\nreturn SpectraSite;');
        const App = factory(window.React);
        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
      } catch (e) {
        document.getElementById('root').innerHTML =
          '<pre style="padding:24px;color:#b00020;white-space:pre-wrap;font:13px/1.5 monospace">' +
          (e && e.stack ? e.stack : e) + '</pre>';
        console.error(e);
      }
    })();
  </script>
</body>
</html>
